# 推送 vYYYY.MM.DD 标签时自动构建并发布。
# 流程：建草稿 Release → 各平台并行构建、上传 → 全部成功后生成校验和并转为正式发布。
# 任一平台失败，Release 停在草稿状态，不会出现缺包的公开版本。
name: Release

on:
  push:
    tags:
      # 格式由 set-version.mjs 严格校验，这里放宽，避免 glob 写法不被识别而静默不触发
      - "v*"
  # 推送标签没触发、或要重新构建某个版本时，在 Actions 页面手动运行并填标签
  workflow_dispatch:
    inputs:
      tag:
        description: 要构建的标签，例如 v2026.10.13
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  GH_TOKEN: ${{ github.token }}
  CARGO_TERM_COLOR: always

jobs:
  draft:
    name: 创建草稿 Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: 校验标签并计算版本号
        id: version
        run: node scripts/set-version.mjs "$TAG"

      - name: 创建草稿
        run: |
          notes=".github/release-notes/$TAG.md"
          if [ ! -f "$notes" ]; then
            echo "::error::缺少更新日志 $notes"
            exit 1
          fi
          # 重跑工作流时草稿已存在，直接复用
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file "$notes"
          else
            gh release create "$TAG" --draft --verify-tag \
              --title "MDEditor $TAG" --notes-file "$notes"
          fi

  desktop:
    name: ${{ matrix.name }}
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows (amd64)
            runner: windows-latest
            platform: windows
            arch: amd64
          - name: Linux (amd64)
            runner: ubuntu-22.04
            platform: linux
            arch: amd64
          - name: Linux (arm64)
            runner: ubuntu-22.04-arm
            platform: linux
            arch: arm64
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ needs.draft.outputs.version }}
      # linuxdeploy 自带的 strip 太旧，处理新版系统库会报错
      NO_STRIP: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: 安装 Linux 构建依赖
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev patchelf file xdg-utils build-essential

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.platform }}-${{ matrix.arch }}

      - name: 写入版本号
        run: node scripts/set-version.mjs "$TAG"

      - run: npm ci

      - name: 构建
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = "linux" ]; then
            npx tauri build --bundles deb,rpm,appimage
          else
            npx tauri build
          fi

      - name: 整理并上传安装包
        shell: bash
        run: |
          bundle=src-tauri/target/release/bundle
          prefix="MDEditor_${VERSION}_${{ matrix.platform }}_${{ matrix.arch }}"
          mkdir -p out
          if [ "${{ matrix.platform }}" = "windows" ]; then
            cp "$bundle"/nsis/*.exe "out/${prefix}_setup.exe"
            cp "$bundle"/msi/*.msi "out/${prefix}.msi"
          else
            cp "$bundle"/deb/*.deb "out/${prefix}.deb"
            cp "$bundle"/rpm/*.rpm "out/${prefix}.rpm"
            cp "$bundle"/appimage/*.AppImage "out/${prefix}.AppImage"
          fi
          ls -la out
          gh release upload "$TAG" out/* --clobber

  android:
    name: Android (arm64)
    needs: draft
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.draft.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 项目的 Gradle 8.14 不支持 JDK 25，必须用 21
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: android-arm64

      - name: 配置 NDK
        run: echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"

      - name: 还原签名密钥
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::缺少 ANDROID_KEYSTORE_BASE64，无法签名"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          cat > src-tauri/gen/android/keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: 写入版本号
        run: node scripts/set-version.mjs "$TAG"

      - run: npm ci

      - name: 构建
        run: npx tauri android build --apk --target aarch64

      - name: 校验签名并上传
        run: |
          apk=src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          # 未签名的 APK 装不上，宁可失败也不发出去
          "$apksigner" verify --print-certs "$apk"
          mkdir -p out
          cp "$apk" "out/MDEditor_${VERSION}_android_arm64.apk"
          gh release upload "$TAG" out/* --clobber

      - name: 清理密钥
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" src-tauri/gen/android/keystore.properties

  publish:
    name: 发布
    needs: [desktop, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: 生成校验和
        run: |
          mkdir assets && cd assets
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "MDEditor_*"
          sha256sum MDEditor_* > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release upload "$TAG" SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber

      - name: 转为正式发布
        run: gh release edit "$TAG" --draft=false --latest
